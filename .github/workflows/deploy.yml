# Build the app and publish it to GitHub Pages.
#
# Settings -> Pages -> Source MUST be "GitHub Actions", not "Deploy from a
# branch". With a branch selected, GitHub ALSO publishes that branch's root
# directly, and the two deploys race: the root holds the unbuilt index.html,
# which asks the browser for /src/main.tsx and 404s. The site served a blank
# page for a few minutes that way. Whichever deploy lands last wins, so this is
# not a preference — a branch source silently breaks the site at random.
#
# After that every push to the branch below redeploys automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/marker-counter-app-fjne2m
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy supersede one already in flight, but never cancel a run
# that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
